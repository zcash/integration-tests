[builder.limits]
orchard_actions = 250

[consensus]
network = "regtest"
# These activation heights MUST match the ones zebrad is started with for the
# shared cache, or wallet sync fails with "Missing Orchard tree state". The
# branch ids are Overwinter, Sapling, Blossom, Heartwood, Canopy and NU5; in
# particular c2d6d0b4 (NU5) at height 1 must agree with
# REGTEST_CACHE_ACTIVATION_HEIGHTS in qa/rpc-tests/test_framework/util.py.
regtest_nuparams = [
    "5ba81b19:1", # Overwinter
    "76b809bb:1", # Sapling
    "2bb40e60:1", # Blossom
    "f5b9230b:1", # Heartwood
    "e9ff75a6:1", # Canopy
    "c2d6d0b4:1", # NU5
]

