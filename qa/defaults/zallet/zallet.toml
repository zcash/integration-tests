# The `zallet` launcher reads this top-level key and execs the matching backend
# binary (here `zallet-zaino`). The integration suite runs in regtest, which the
# default `zebra` backend does not support. Top-level keys must precede the first
# table header.
backend = "zaino"

[builder.limits]
orchard_actions = 250

[consensus]
network = "regtest"
regtest_nuparams = [
    "5ba81b19:1", # Overwinter
    "76b809bb:1", # Sapling
    "2bb40e60:1", # Blossom
    "f5b9230b:1", # Heartwood
    "e9ff75a6:1", # Canopy
    "c2d6d0b4:1", # NU5
    "c8e71055:1", # NU6
    "4dec4df0:1", # NU6_1
    "5437f330:1", # NU6_2
]

[database]

[external]

[features]
as_of_version = "0.0.0"

[features.deprecated]

[features.experimental]

[indexer]
validator_address = "127.0.0.1:0"
validator_user = ".."
validator_password = ".."

[keystore]

[note_management]

[rpc]
bind = ["127.0.0.1:0"]

[[rpc.auth]]
user = "zebra"
pwhash = "eaa27c81df81f655e69bbe84026e733a$bb9f70d53decfeca863cb114f7b0fd5ae050c7ef885c3d5fa73d5bace6c14fea"
