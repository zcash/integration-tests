name: 'Finish interop'
description: 'Updates status with CI result'
inputs:
  zebra-app-token:
    description: 'Access token for updating the Zebra pending status'
    required: true
  zallet-app-token:
    description: 'Access token for updating the Zallet pending status'
    required: true
  zaino-app-token:
    description: 'Access token for updating the Zaino pending status'
    required: true
  job-name:
    description: 'Name of the job to report to the requesting repository'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Update requesting repo status with result
      if: always()
      shell: sh
      env:
        ZEBRA_TOKEN: ${{ inputs.zebra-app-token }}
        ZALLET_TOKEN: ${{ inputs.zallet-app-token }}
        ZAINO_TOKEN: ${{ inputs.zaino-app-token }}
        ACTION: ${{ github.event.action }}
        SHA: ${{ github.event.client_payload.sha }}
        JOB_NAME: ${{ inputs.job-name }}
        STATUS: ${{ case(job.status == 'cancelled', 'error', job.status) }}
        TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        case "${ACTION}" in
          zebra-interop-request)  repo="ZcashFoundation/zebra"; token="${ZEBRA_TOKEN}" ;;
          zallet-interop-request) repo="zcash/wallet";          token="${ZALLET_TOKEN}" ;;
          zaino-interop-request)  repo="zingolabs/zaino";       token="${ZAINO_TOKEN}" ;;
          *) echo "Unknown action: ${ACTION}"; exit 0 ;;
        esac
        GH_TOKEN="${token}" gh api "repos/${repo}/statuses/${SHA}" \
          --field state="${STATUS}" \
          --field target_url="${TARGET_URL}" \
          --field description="Finished" \
          --field context="Integration tests / ${JOB_NAME}"
