name: Build binary

# Reusable workflow that builds a single binary (zebrad, zainod, or the zallet
# launcher plus its zaino and zebra backends) for a given set of platforms. It is called
# twice per binary from `ci.yml`: once for the platforms the tests run on, and
# once for the build-only platforms (macOS, Windows, cross-compiled targets).
# Splitting the matrix this way lets the test jobs depend only on the builds
# they actually consume, instead of waiting for every platform to finish
# building.
#
# Cache final binaries by their immutable source, platform, and build recipe.
# Setup resolves all three projects once, so required and
# extra platforms cannot select different moving branch heads. An exact cache
# hit skips the build and source checkout. A post-build step prunes the
# per-binary, per-platform caches to the most recent 5 versions, which is why
# this workflow needs `actions: write`.

on:
  workflow_call:
    inputs:
      build_matrix:
        description: JSON array of platform configs to build.
        required: true
        type: string
      repository:
        description: The owner/name of the source repository to build.
        required: true
        type: string
      source_sha:
        description: The full source commit SHA resolved by setup.
        required: true
        type: string
      test_sha:
        description: The full integration-tests commit SHA checked out by setup.
        required: true
        type: string
      path:
        description: Path to check the source out into (also the cargo workspace).
        required: true
        type: string
      bin:
        description: The cargo binary (and artifact name prefix) to build.
        required: true
        type: string
      job_name_prefix:
        description: Prefix for the per-platform job and interop status name.
        required: true
        type: string
      is_zallet:
        description: Whether to apply zallet-specific build and packaging steps.
        required: false
        type: boolean
        default: false
      extra_build_args:
        description: >-
          Extra args appended to the `cargo build` invocation for the
          non-zallet build path (e.g. "--features indexer" for zebrad). Ignored
          when is_zallet is true.
        required: false
        type: string
        default: ''
    secrets:
      STATUS_APP_ID:
        description: Status-reporting GitHub App ID (for interop requests).
        required: true
      STATUS_APP_PRIVATE_KEY:
        description: Status-reporting GitHub App private key.
        required: true

permissions:
  contents: read
  # Needed by the "Prune old binary caches" step to delete stale caches via the
  # Actions cache API. The calling jobs in ci.yml grant this per-job.
  actions: write

jobs:
  build:
    name: ${{ inputs.job_name_prefix }} ${{ matrix.platform }}${{ matrix.required_suffix }}
    runs-on: ${{ matrix.build_os }}
    container:
      image: ${{ matrix.container }}
      env:
        HOME: /root
        PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
    continue-on-error: ${{ !matrix.required }}
    strategy:
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Check out integration-tests to access actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.test_sha }}
          path: integration-tests
          persist-credentials: false

      - name: Compute interop repo ids
        id: repo-ids
        uses: ./integration-tests/.github/actions/interop-repo-ids

      - id: start-interop
        uses: ./integration-tests/.github/actions/start-interop
        with:
          status-app-id: ${{ secrets.STATUS_APP_ID }}
          status-app-private-key: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          job-name: "${{ inputs.job_name_prefix }} ${{ matrix.platform }}${{ matrix.required_suffix }}"

      # Local reusable workflows run from the caller's workflow revision, even
      # when test_sha selects different scripts. Hash the workflow we execute.
      - name: Check out the executing build workflow
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: build-workflow
          sparse-checkout: .github/workflows/build-binary.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Identify the immutable build recipe
        id: recipe
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TEST_SHA: ${{ inputs.test_sha }}
          REPOSITORY: ${{ inputs.repository }}
          SOURCE_PATH: ${{ inputs.path }}
          BIN: ${{ inputs.bin }}
          IS_ZALLET: ${{ inputs.is_zallet }}
          EXTRA_BUILD_ARGS: ${{ inputs.extra_build_args }}
          PLATFORM: ${{ toJSON(matrix) }}
          WORKFLOW_FILE: ${{ hashFiles('build-workflow/.github/workflows/build-binary.yml') }}
          BUILD_SCRIPTS: ${{ inputs.is_zallet && hashFiles('integration-tests/.github/scripts/build-zallet.sh', 'integration-tests/.github/scripts/stage-zallet-db-dump.sh') || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import re

          for name in ("SOURCE_SHA", "TEST_SHA"):
              if not re.fullmatch(r"[0-9a-f]{40}", os.environ[name]):
                  raise ValueError(f"{name} must be a resolved full commit SHA")
          fields = ("REPOSITORY", "SOURCE_PATH", "BIN", "IS_ZALLET",
                    "EXTRA_BUILD_ARGS", "WORKFLOW_FILE", "BUILD_SCRIPTS")
          platform = json.loads(os.environ["PLATFORM"])
          build_platform = {key: platform.get(key, "") for key in (
              "name", "build_os", "container", "host", "rust_target",
              "file_ext", "brew_deps", "cross_deps",
          )}
          recipe = "\0".join([*(os.environ[name] for name in fields),
                              json.dumps(build_platform, sort_keys=True)])
          print(f"hash={hashlib.sha256(recipe.encode()).hexdigest()}")
          PY

      # Exact matches only: never reuse a final executable from another source
      # or build recipe. The source SHA also pins its manifests and locks.
      # Only one restore step runs; `binary-cache.hit` combines their results.
      - name: Restore cached ${{ inputs.bin }} binary (single workspace)
        id: binary-cache-single
        if: ${{ !inputs.is_zallet }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ format('./{0}/target/{1}/release/{2}{3}', inputs.path, matrix.rust_target, inputs.bin, matrix.file_ext) }}
          key: binary-${{ inputs.bin }}-${{ matrix.name }}-${{ inputs.source_sha }}-${{ steps.recipe.outputs.hash }}

      - name: Restore cached zallet binaries
        id: binary-cache-zallet
        if: ${{ inputs.is_zallet }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The launcher, the zaino backend binary, and the vendored db_dump all
          # land in ./zallet/dist; cache the directory as a unit.
          path: ./zallet/dist
          key: binary-${{ inputs.bin }}-${{ matrix.name }}-${{ inputs.source_sha }}-${{ steps.recipe.outputs.hash }}

      - name: Determine binary cache hit
        id: binary-cache
        shell: bash
        env:
          IS_ZALLET: ${{ inputs.is_zallet }}
          SINGLE_HIT: ${{ steps.binary-cache-single.outputs.cache-hit }}
          ZALLET_HIT: ${{ steps.binary-cache-zallet.outputs.cache-hit }}
        run: |
          if [ "${IS_ZALLET}" = "true" ]; then
            echo "hit=${ZALLET_HIT}" >> "$GITHUB_OUTPUT"
          else
            echo "hit=${SINGLE_HIT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ${{ inputs.repository }}
        if: steps.binary-cache.outputs.hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.repository }}
          # Build exactly the source whose manifests and locks identify the cache.
          ref: ${{ inputs.source_sha }}
          path: ${{ inputs.path }}
          persist-credentials: false

      - name: Install Homebrew build dependencies
        if: matrix.brew_deps != '' && steps.binary-cache.outputs.hit != 'true'
        run: brew install ${{ matrix.brew_deps }}

      - name: Install cross-compilation build dependencies
        if: matrix.cross_deps != '' && steps.binary-cache.outputs.hit != 'true'
        run: sudo apt update && sudo apt install ${{ matrix.cross_deps }}

      - name: Configure MinGW to use POSIX variant
        if: matrix.name == 'mingw32' && steps.binary-cache.outputs.hit != 'true'
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc $(update-alternatives --query x86_64-w64-mingw32-gcc | grep Alternative | grep posix | cut -d' ' -f2)
          sudo update-alternatives --set x86_64-w64-mingw32-g++ $(update-alternatives --query x86_64-w64-mingw32-g++ | grep Alternative | grep posix | cut -d' ' -f2)

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        if: steps.binary-cache.outputs.hit != 'true'
        shell: bash
        run: echo "timestamp=$(date +'%Y-%m-%d-%H;%M;%S')" >> "$GITHUB_OUTPUT"

      - name: Cache ccache files
        if: steps.binary-cache.outputs.hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ccache' || '~/.cache/ccache' }}
          key: ${{ matrix.name }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ matrix.name }}-ccache-

      - name: Cache cargo build (single workspace)
        if: ${{ !inputs.is_zallet && steps.binary-cache.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.name }}-${{ inputs.bin }}
          workspaces: "./${{ inputs.path }}"

      - name: Cache cargo build (zallet launcher + backends)
        if: ${{ inputs.is_zallet && steps.binary-cache.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.name }}-${{ inputs.bin }}
          # zallet is three workspaces: the root (the `zallet` launcher),
          # backends/zaino (`zallet-zaino`), and backends/zebra
          # (`zallet-zebra`), each with its own target directory. Cache all.
          workspaces: |
            zallet
            zallet/backends/zaino
            zallet/backends/zebra

      - name: Install Rust target
        if: steps.binary-cache.outputs.hit != 'true'
        run: rustup target add ${{ matrix.rust_target }}
        working-directory: ./${{ inputs.path }}

      - name: Build ${{ inputs.bin }}
        if: ${{ !inputs.is_zallet && steps.binary-cache.outputs.hit != 'true' }}
        env:
          HOST: ${{ matrix.host }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: "aarch64-linux-gnu-gcc"
          BIN: ${{ inputs.bin }}
          EXTRA_BUILD_ARGS: ${{ inputs.extra_build_args }}
        run: cargo build --locked --release --target ${{ matrix.rust_target }} --bin "${BIN}" ${EXTRA_BUILD_ARGS}
        working-directory: ./${{ inputs.path }}

      # Build the `zallet` launcher plus the `zallet-zaino` and `zallet-zebra`
      # backend binaries the regtest suite exercises. See
      # .github/scripts/build-zallet.sh. zcashd-import is disabled on mingw32:
      # its pqcrypto-mlkem dep fails to cross-compile to windows-gnu, and the
      # tests needing it are Linux-only.
      - name: Build zallet
        if: ${{ inputs.is_zallet && steps.binary-cache.outputs.hit != 'true' }}
        env:
          HOST: ${{ matrix.host }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: "aarch64-linux-gnu-gcc"
          RUST_TARGET: ${{ matrix.rust_target }}
          FILE_EXT: ${{ matrix.file_ext }}
          ZCASHD_IMPORT: ${{ matrix.name != 'mingw32' && '--features zcashd-import' || '' }}
        shell: bash
        working-directory: ./zallet
        run: "${{ github.workspace }}/integration-tests/.github/scripts/build-zallet.sh"

      - name: Stage vendored db_dump
        if: ${{ inputs.is_zallet && matrix.name != 'mingw32' && runner.os != 'Windows' && steps.binary-cache.outputs.hit != 'true' }}
        shell: bash
        working-directory: ./zallet
        run: "${{ github.workspace }}/integration-tests/.github/scripts/stage-zallet-db-dump.sh"

      - name: Upload ${{ inputs.bin }}
        if: ${{ !inputs.is_zallet }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.bin }}-${{ matrix.name }}
          path: |
              ${{ format('./{0}/target/{1}/release/{2}{3}', inputs.path, matrix.rust_target, inputs.bin, matrix.file_ext) }}

      # Upload the launcher, both backend binaries, and the vendored db_dump.
      # They land flat in ./src on the test runners; the launcher finds the
      # sibling zallet-zaino / zallet-zebra next to itself, selected by the
      # config `backend` key.
      - name: Upload zallet
        if: ${{ inputs.is_zallet }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zallet-${{ matrix.name }}
          path: |
              ${{ format('./zallet/dist/zallet{0}', matrix.file_ext) }}
              ${{ format('./zallet/dist/zallet-zaino{0}', matrix.file_ext) }}
              ${{ format('./zallet/dist/zallet-zebra{0}', matrix.file_ext) }}
              ./zallet/dist/db_dump
          if-no-files-found: warn

      # Bound the cache to the 5 most recent upstream versions for this binary
      # and platform (issue #156), deleting older ones. Best-effort: a failure
      # here (e.g. a read-only token on a fork PR) must not fail the build.
      - name: Prune old ${{ inputs.bin }} binary caches
        if: steps.binary-cache.outputs.hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: binary-${{ inputs.bin }}-${{ matrix.name }}-
          KEEP: "5"
        run: "${{ github.workspace }}/integration-tests/.github/scripts/prune-binary-caches.sh"

      - uses: ./integration-tests/.github/actions/finish-interop
        if: always()
        with:
          app-token: ${{ steps.start-interop.outputs.app-token }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          job-name: "${{ inputs.job_name_prefix }} ${{ matrix.platform }}${{ matrix.required_suffix }}"
