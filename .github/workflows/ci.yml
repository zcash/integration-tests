name: CI

on:
  pull_request:
    # Any update here needs to be done for `push` (see below), and mirrored into
    # `no-ci.yml`.
    paths-ignore:
      # Workflows that have no effect on this workflow.
      - '.github/dependabot.yml'
      - '.github/workflows/book.yml'
      - '.github/workflows/ci-skip.yml'
      - '.github/workflows/lints.yml'
      # Documentation.
      - 'doc/**'
      - '**.md'
      - 'COPYING'
  push:
    branches: main
    # Any update here needs to be done for `pull_request` (see above), and
    # mirrored into `ci-skip.yml`.
    paths-ignore:
      # Workflows that have no effect on this workflow.
      - '.github/dependabot.yml'
      - '.github/workflows/book.yml'
      - '.github/workflows/ci-skip.yml'
      - '.github/workflows/lints.yml'
      # Documentation.
      - 'doc/**'
      - '**.md'
      - 'COPYING'
  repository_dispatch:
    types:
      - zebra-interop-request
      - zaino-interop-request
      - zallet-interop-request

permissions:
  contents: read

jobs:
  setup:
    name: Define CI matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cfg:
          - data:
            # - name: Debian-bookworm
            #   required: true
            #   platform: Debian Bookworm
            #   build_os: ${{ vars.UBUNTU_22_04_LARGE_RUNNER || 'ubuntu-22.04' }}
            #   test_os: ubuntu-22.04
            #   container: electriccoinco/debian-helper:bookworm
            #   host: x86_64-pc-linux-gnu
            #   rust_target: x86_64-unknown-linux-gnu

            # - name: Debian-bullseye
            #   required: true
            #   platform: Debian bullseye
            #   build_os: ${{ vars.UBUNTU_22_04_LARGE_RUNNER || 'ubuntu-22.04' }}
            #   test_os: ubuntu-22.04
            #   container: electriccoinco/debian-helper:bullseye
            #   host: x86_64-pc-linux-gnu
            #   rust_target: x86_64-unknown-linux-gnu

            # The tests run on ubuntu-latest (the required test platform). We
            # additionally build on the pinned ubuntu-22.04 and ubuntu-24.04
            # images for build coverage, but no test runs on them (they have no
            # test_os), so they do not gate CI or block the tests.
            - name: ubuntu-latest
              required: true
              platform: Ubuntu (latest)
              build_os: ubuntu-latest
              test_os: ubuntu-latest
              host: x86_64-pc-linux-gnu
              rust_target: x86_64-unknown-linux-gnu

            - name: ubuntu-22.04
              required: false
              platform: Ubuntu 22.04
              build_os: ${{ vars.UBUNTU_22_04_LARGE_RUNNER || 'ubuntu-22.04' }}
              host: x86_64-pc-linux-gnu
              rust_target: x86_64-unknown-linux-gnu

            - name: ubuntu-24.04
              required: false
              platform: Ubuntu 24.04
              build_os: ubuntu-24.04
              host: x86_64-pc-linux-gnu
              rust_target: x86_64-unknown-linux-gnu

            # - name: macos-12
            #   required: false
            #   platform: macOS 12 Monterey
            #   build_os: macos-12
            #   test_os: macos-12
            #   brew_deps: >
            #     autoconf
            #     automake
            #     coreutils
            #     libtool
            #     pkgconfig
            #   host: x86_64-apple-darwin
            #   rust_target: x86_64-apple-darwin

            - name: mingw32
              required: false
              platform: Windows (64-bit MinGW)
              build_os: ${{ vars.UBUNTU_22_04_LARGE_RUNNER || 'ubuntu-22.04' }}
              test_os: windows-latest
              cross_deps: >
                mingw-w64
              host: x86_64-w64-mingw32
              rust_target: x86_64-pc-windows-gnu
              file_ext: ".exe"

            - name: aarch64-linux
              required: false
              platform: ARM64 Linux
              build_os: ${{ vars.UBUNTU_22_04_LARGE_RUNNER || 'ubuntu-22.04' }}
              cross_deps: >
                g++-aarch64-linux-gnu
              host: aarch64-linux-gnu
              rust_target: aarch64-unknown-linux-gnu

    outputs:
      build_matrix: ${{ steps.set-matrices.outputs.build_matrix }}
      build_names: ${{ steps.set-matrices.outputs.build_names }}
      test_build_matrix: ${{ steps.set-matrices.outputs.test_build_matrix }}
      extra_build_matrix: ${{ steps.set-matrices.outputs.extra_build_matrix }}
      python_version: ${{ steps.python-version.outputs.version }}
      test_matrix: ${{ steps.set-matrices.outputs.test_matrix }}
      test_names: ${{ steps.set-matrices.outputs.test_names }}
      unix_test_matrix: ${{ steps.set-matrices.outputs.unix_test_matrix }}
      unix_test_names: ${{ steps.set-matrices.outputs.unix_test_names }}
      rpc_test_matrix: ${{ steps.set-matrices.outputs.rpc_test_matrix }}
      rpc_test_names: ${{ steps.set-matrices.outputs.rpc_test_names }}
      rpc_test_shards: ${{ steps.set-rpc-tests.outputs.rpc_test_shards }}
      rpc_test_shards_matrix: ${{ steps.set-rpc-tests.outputs.rpc_test_shards_matrix }}

    steps:
      - name: Select the test branch
        id: test-branch
        if: endsWith(github.event.action, '-interop-request')
        env:
          TEST_SHA: ${{ github.event.client_payload.test_sha }}
        run: |
          if [ "${TEST_SHA}" != "null" ] && [ -n "${TEST_SHA}" ]; then
            echo "test_sha=${TEST_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Check out the selected test branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Empty on direct repo PRs, which selects the default.
          ref: ${{ steps.test-branch.outputs.test_sha }}
          persist-credentials: false

      # Source the Python version for the test jobs from the uv lockfile, so it
      # has a single point of definition and follows the project's pin. We take
      # the minimal version from `requires-python` (e.g. ">=3.12" -> "3.12").
      - id: python-version
        run: |
          version=$(grep -m1 '^requires-python' uv.lock \
            | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$version" ]; then
            echo "Could not read requires-python from uv.lock" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # When triggered by repository_dispatch, callers may specify a subset of
      # platforms to run via client_payload.platforms (a JSON array of platform
      # names). When absent, all platforms run. Explicitly requested platforms
      # are treated as required (run RPC tests, must pass).
      - id: filter-platforms
        env:
          CFG: ${{ toJSON(matrix.cfg) }}
          REQUESTED_PLATFORMS: ${{ toJSON(github.event.client_payload.platforms) }}
        run: |
          if [ "$REQUESTED_PLATFORMS" != "null" ] && [ -n "$REQUESTED_PLATFORMS" ]; then
            # Identify requested platforms not present in the configuration.
            jq -r -n --argjson req "$REQUESTED_PLATFORMS" \
              'env.CFG | fromjson | .data | [.[].name] as $known
              | [$req[] | select(. as $n | $known | index($n) | not)]
              | @json "unsupported_platforms=\(.)"' >> $GITHUB_OUTPUT
            # Filter to requested platforms, mark as required, and add suffix.
            jq -r -n --argjson req "$REQUESTED_PLATFORMS" '
              env.CFG | fromjson
              | .data |= [.[] | select(.name as $n | $req | index($n))
                | .required = true | .required_suffix = " (required)"]
              | @json "cfg=\(.)"' >> $GITHUB_OUTPUT
          else
            # Add required_suffix based on the existing required flag.
            jq -r -n '
              env.CFG | fromjson
              | .data |= [.[] | .required_suffix = if .required then " (required)" else "" end]
              | @json "cfg=\(.)"' >> $GITHUB_OUTPUT
          fi

      - name: Compute interop repo ids
        id: repo-ids
        uses: ./.github/actions/interop-repo-ids

      - id: notify-interop-error
        uses: ./.github/actions/notify-interop-error
        if: endsWith(github.event.action, '-interop-request') && steps.filter-platforms.outputs.unsupported_platforms != '[]'
        with:
          status-app-id: ${{ secrets.STATUS_APP_ID }}
          status-app-private-key: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          unsupported-platforms: ${{ steps.filter-platforms.outputs.unsupported_platforms }}

      # Configure the build and test matrices. Notes:
      # - The `*_names` lists of platforms are combined with job-specific lists to build
      #   strategy matrices. The `*_matrix` lists then augment the matrix with parameters
      #   for each platform.
      # - We can only run tests on the subset of platforms that have a compatible runner
      #   (i.e. excluding cross-compiled platforms).
      # - Some tests don't currently work on Windows platforms, so we have a Unix subset.
      # - We only run RPC tests on required platforms, to save costs.
      - id: set-matrices
        env:
          CFG: ${{ steps.filter-platforms.outputs.cfg }}
        run: |
          jq -r -n 'env.CFG | fromjson | @json "build_matrix=\(.data)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | .name] | @json "build_names=\(.)"' >> $GITHUB_OUTPUT
          # Split the build matrix into the platforms the tests actually consume
          # artifacts for, and the build-only platforms (cross-compiled targets
          # and Windows, which no job here tests). This lets the test jobs depend
          # only on the former, instead of blocking on every platform's build.
          # The two selects are exact complements, so they partition the matrix.
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os and (.test_os != "windows-latest" or .required))] | @json "test_build_matrix=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select((.test_os | not) or (.test_os == "windows-latest" and (.required | not)))] | @json "extra_build_matrix=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os)] | @json "test_matrix=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os) | .name] | @json "test_names=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os and .test_os != "windows-latest")] | @json "unix_test_matrix=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os and .test_os != "windows-latest") | .name] | @json "unix_test_names=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os and .required)] | @json "rpc_test_matrix=\(.)"' >> $GITHUB_OUTPUT
          jq -r -n 'env.CFG | fromjson | [.data[] | select(.test_os and .required) | .name] | @json "rpc_test_names=\(.)"' >> $GITHUB_OUTPUT

      - id: set-rpc-tests
        env:
          IS_INTEROP_REQUEST: ${{ endsWith(github.event.action, '-interop-request') }}
        run: |
          cat <<EOF > ./subclass.py
          import importlib
          import json
          import os
          import sys

          sys.path.append('qa/pull-tester')
          rpc_tests = importlib.import_module('rpc-tests')

          src_dir = os.environ["SRC_DIR"]
          is_interop_request = os.environ["IS_INTEROP_REQUEST"] == "true"
          SHARDS = 10

          # These tests are ordered longest-test-first, to favor running tests in
          # parallel with the regular test runner. For chunking purposes, assign
          # tests to shards in round-robin order. Fewer tests than SHARDS simply
          # yields fewer shards; every test lands in exactly one.
          test_shards = {}
          for i, test in enumerate(rpc_tests.BASE_SCRIPTS):
              test_shards.setdefault(i % SHARDS, []).append(test)

          test_list = []
          for i, tests in test_shards.items():
              test_list.append({
                  'shard': 'shard-%d' % i,
                  'rpc_tests': tests,
              })

          # These tests involve enough shielded spends (consuming all CPU cores)
          # that we can't run them in parallel, or fail intermittently so we run
          # them separately to enable not requiring that they pass.
          if not is_interop_request:
              for test in rpc_tests.SERIAL_SCRIPTS + rpc_tests.FLAKY_SCRIPTS:
                  test_list.append({
                      'shard': test,
                      'rpc_tests': [test],
                  })

          print(json.dumps(test_list))
          EOF
          RPC_MATRIX_JSON=$(echo '${{ steps.set-matrices.outputs.rpc_test_matrix }}')
          RPC_SHARDS_JSON=$(SRC_DIR=$(pwd) python3 ./subclass.py)
          echo "$RPC_SHARDS_JSON" | jq -r '[.[] | .shard] | @json "rpc_test_shards=\(.)"' >> $GITHUB_OUTPUT
          echo -e "$RPC_MATRIX_JSON\n$RPC_SHARDS_JSON" | jq -r -s 'add | @json "rpc_test_shards_matrix=\(.)"' >> $GITHUB_OUTPUT

      - name: Cache Sprout parameters
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zcash-params
          key: zcash-params
          restore-keys: |
            zcash-params

      - name: Download Sprout parameters
        # In case the Sprout parameters are not currently cached
        shell: bash
        run: |
          mkdir zcash-params || echo ""
          curl -L -C - https://download.z.cash/downloads/sprout-groth16.params -o zcash-params/sprout-groth16.params

  # Each binary is built by the reusable build-binary.yml workflow, called twice:
  # `build-<bin>` builds the platforms the tests consume, and `build-<bin>-extra`
  # builds the remaining build-only platforms (Windows, cross-compiled targets,
  # macOS). The test jobs depend only on the `build-<bin>` jobs, so they no
  # longer wait for the build-only platforms. The `if` guards skip a call when
  # its slice of the matrix is empty (possible for a platform-filtered interop
  # request), which avoids an empty build matrix.
  build-zebra:
    needs: setup
    if: ${{ needs.setup.outputs.test_build_matrix != '[]' }}
    # actions: write lets build-binary.yml prune old binary caches (issue #156).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-binary.yml
    secrets:
      STATUS_APP_ID: ${{ secrets.STATUS_APP_ID }}
      STATUS_APP_PRIVATE_KEY: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
    with:
      build_matrix: ${{ needs.setup.outputs.test_build_matrix }}
      repository: ZcashFoundation/zebra
      default_ref: refs/heads/main
      interop_action: zebra-interop-request
      path: zebra
      bin: zebrad
      job_name_prefix: Build zebrad on
      # The zallet zebra backend follows zebrad's non-finalized tip over its
      # gRPC indexer interface, which is gated behind the non-default `indexer`
      # feature. Build it in for both backends (harmless to the zaino backend).
      extra_build_args: --features indexer

  build-zebra-extra:
    needs: setup
    if: ${{ needs.setup.outputs.extra_build_matrix != '[]' }}
    # actions: write lets build-binary.yml prune old binary caches (issue #156).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-binary.yml
    secrets:
      STATUS_APP_ID: ${{ secrets.STATUS_APP_ID }}
      STATUS_APP_PRIVATE_KEY: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
    with:
      build_matrix: ${{ needs.setup.outputs.extra_build_matrix }}
      repository: ZcashFoundation/zebra
      default_ref: refs/heads/main
      interop_action: zebra-interop-request
      path: zebra
      bin: zebrad
      job_name_prefix: Build zebrad on
      extra_build_args: --features indexer

  build-zaino:
    needs: setup
    if: ${{ needs.setup.outputs.test_build_matrix != '[]' }}
    # actions: write lets build-binary.yml prune old binary caches (issue #156).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-binary.yml
    secrets:
      STATUS_APP_ID: ${{ secrets.STATUS_APP_ID }}
      STATUS_APP_PRIVATE_KEY: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
    with:
      build_matrix: ${{ needs.setup.outputs.test_build_matrix }}
      repository: zingolabs/zaino
      default_ref: refs/heads/dev
      interop_action: zaino-interop-request
      path: zaino
      bin: zainod
      job_name_prefix: Build zainod on

  build-zaino-extra:
    needs: setup
    if: ${{ needs.setup.outputs.extra_build_matrix != '[]' }}
    # actions: write lets build-binary.yml prune old binary caches (issue #156).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-binary.yml
    secrets:
      STATUS_APP_ID: ${{ secrets.STATUS_APP_ID }}
      STATUS_APP_PRIVATE_KEY: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
    with:
      build_matrix: ${{ needs.setup.outputs.extra_build_matrix }}
      repository: zingolabs/zaino
      default_ref: refs/heads/dev
      interop_action: zaino-interop-request
      path: zaino
      bin: zainod
      job_name_prefix: Build zainod on

  build-zallet:
    needs: setup
    if: ${{ needs.setup.outputs.test_build_matrix != '[]' }}
    # actions: write lets build-binary.yml prune old binary caches (issue #156).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-binary.yml
    secrets:
      STATUS_APP_ID: ${{ secrets.STATUS_APP_ID }}
      STATUS_APP_PRIVATE_KEY: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
    with:
      build_matrix: ${{ needs.setup.outputs.test_build_matrix }}
      repository: zcash/zallet
      default_ref: refs/heads/main
      interop_action: zallet-interop-request
      path: zallet
      bin: zallet
      job_name_prefix: Build zallet on
      is_zallet: true

  build-zallet-extra:
    needs: setup
    if: ${{ needs.setup.outputs.extra_build_matrix != '[]' }}
    # actions: write lets build-binary.yml prune old binary caches (issue #156).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-binary.yml
    secrets:
      STATUS_APP_ID: ${{ secrets.STATUS_APP_ID }}
      STATUS_APP_PRIVATE_KEY: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
    with:
      build_matrix: ${{ needs.setup.outputs.extra_build_matrix }}
      repository: zcash/zallet
      default_ref: refs/heads/main
      interop_action: zallet-interop-request
      path: zallet
      bin: zallet
      job_name_prefix: Build zallet on
      is_zallet: true

  # Not working in Windows
  sec-hard:
    name: sec-hard ${{ matrix.platform }}${{ matrix.required_suffix }}
    needs:
      - setup
      - build-zebra
      - build-zaino
      - build-zallet
    runs-on: ${{ matrix.test_os }}
    container:
      image: ${{ matrix.container }}
      env:
        HOME: /root
        PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
    continue-on-error: ${{ !matrix.required }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.unix_test_matrix) }}

    steps:
      - name: Select the test branch
        id: test-branch
        if: endsWith(github.event.action, '-interop-request')
        env:
          TEST_SHA: ${{ github.event.client_payload.test_sha }}
        run: |
          if [ "${TEST_SHA}" != "null" ] && [ -n "${TEST_SHA}" ]; then
            echo "test_sha=${TEST_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Check out the selected test branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Empty on direct repo PRs, which selects the default.
          ref: ${{ steps.test-branch.outputs.test_sha }}
          persist-credentials: false

      - name: Compute interop repo ids
        id: repo-ids
        uses: ./.github/actions/interop-repo-ids

      - id: start-interop
        uses: ./.github/actions/start-interop
        with:
          status-app-id: ${{ secrets.STATUS_APP_ID }}
          status-app-private-key: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          job-name: "sec-hard ${{ matrix.platform }}${{ matrix.required_suffix }}"

      - name: Download zebrad artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zebrad-${{ matrix.name }}
          path: ./src

      - name: Download zainod artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zainod-${{ matrix.name }}
          path: ./src

      - name: Download zallet artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zallet-${{ matrix.name }}
          path: ./src

      - name: Make artifact executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          FILE_EXT: ${{ matrix.file_ext }}
        run: ./.github/scripts/make-zcash-artifacts-executable.sh

      - name: Run sec-hard test
        shell: bash
        run: python3 ./qa/zcash/full_test_suite.py sec-hard
        env:
          HOST: ${{ matrix.host }}

      - uses: ./.github/actions/finish-interop
        if: always()
        with:
          app-token: ${{ steps.start-interop.outputs.app-token }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          job-name: "sec-hard ${{ matrix.platform }}${{ matrix.required_suffix }}"

  rpc-depends:
    name: RPC set up ${{ matrix.platform }}${{ matrix.required_suffix }}
    needs: setup
    runs-on: ${{ matrix.test_os }}
    container:
      image: ${{ matrix.container }}
      env:
        HOME: /root
        PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
    continue-on-error: ${{ !matrix.required }}
    strategy:
      matrix:
        name: ${{ fromJson(needs.setup.outputs.rpc_test_names) }}
        include: ${{ fromJson(needs.setup.outputs.rpc_test_matrix) }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ needs.setup.outputs.python_version }}

      - name: Cache Python dependencies for RPC tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: venv
          key: test-rpc-venv-${{ matrix.name }}-py${{ needs.setup.outputs.python_version }}

      - name: Get Python dependencies for RPC tests
        run: |
          python3 -m venv ./venv
          . ./venv/bin/activate
          pip install toml embit

  test-rpc:
    name: RPC tests ${{ matrix.platform }} ${{ matrix.backend }} ${{ matrix.shard }}${{ matrix.required_suffix }}
    needs:
      - setup
      - build-zebra
      - build-zaino
      - build-zallet
      - rpc-depends
    runs-on: ${{ matrix.test_os }}
    container:
      image: ${{ matrix.container }}
      env:
        HOME: /root
        PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        # Run the same RPC suite against each zallet backend. The launcher execs
        # the matching per-backend binary, selected by the ZALLET_BACKEND env var
        # the test step exports (see the "RPC test" step). Both backends are
        # required on the required platforms (no continue-on-error for zebra).
        backend: [zaino, zebra]
        name: ${{ fromJson(needs.setup.outputs.rpc_test_names) }}
        shard : ${{ fromJson(needs.setup.outputs.rpc_test_shards) }}
        include: ${{ fromJson(needs.setup.outputs.rpc_test_shards_matrix) }}

    steps:
      - name: Select the test branch
        id: test-branch
        if: endsWith(github.event.action, '-interop-request')
        env:
          TEST_SHA: ${{ github.event.client_payload.test_sha }}
        run: |
          if [ "${TEST_SHA}" != "null" ] && [ -n "${TEST_SHA}" ]; then
            echo "test_sha=${TEST_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Check out the selected test branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Empty on direct repo PRs, which selects the default.
          ref: ${{ steps.test-branch.outputs.test_sha }}
          persist-credentials: false

      - name: Compute interop repo ids
        id: repo-ids
        uses: ./.github/actions/interop-repo-ids

      - id: start-interop
        uses: ./.github/actions/start-interop
        with:
          status-app-id: ${{ secrets.STATUS_APP_ID }}
          status-app-private-key: ${{ secrets.STATUS_APP_PRIVATE_KEY }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          job-name: "RPC tests ${{ matrix.platform }} ${{ matrix.backend }} ${{ matrix.shard }}${{ matrix.required_suffix }}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ needs.setup.outputs.python_version }}

      - name: Cache Python dependencies for RPC tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: venv
          key: test-rpc-venv-${{ matrix.name }}-py${{ needs.setup.outputs.python_version }}

      - name: Get Python dependencies for RPC tests if not cached
        run: |
          python3 -m venv ./venv
          . ./venv/bin/activate
          pip install toml embit

      - name: Download zebrad artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zebrad-${{ matrix.name }}
          path: ./src

      - name: Download zainod artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zainod-${{ matrix.name }}
          path: ./src

      - name: Download zallet artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zallet-${{ matrix.name }}
          path: ./src

      - name: Make artifact executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          FILE_EXT: ${{ matrix.file_ext }}
        run: ./.github/scripts/make-zcash-artifacts-executable.sh

      # Vendored BDB 6.2 db_dump (shipped in the zallet artifact) goes on PATH
      # so zallet's which::which("db_dump") finds it instead of Ubuntu's 5.3.
      - name: Make db_dump available
        if: matrix.name != 'mingw32' && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f ./src/db_dump ]; then
            chmod +x ./src/db_dump
            echo "$PWD/src" >> "$GITHUB_PATH"
          fi

      - name: Get Sprout parameters
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zcash-params
          key: zcash-params
          restore-keys: |
            zcash-params

      - name: Download Sprout parameters
        # In case the cache of Sprout parameters step fails
        shell: bash
        run: |
          mkdir zcash-params || echo ""
          curl -L -C - https://download.z.cash/downloads/sprout-groth16.params -o zcash-params/sprout-groth16.params

      - name: Setup zcash-params
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv zcash-params "$APPDATA/ZcashParams"
          elif [ "${{ runner.os }}" == "macOS" ]; then
            mv zcash-params "$HOME/Library/Application Support/ZcashParams"
          elif [ "${{ runner.os }}" == "Linux" ]; then
            mv zcash-params "$HOME/.zcash-params"
          fi

      - name: RPC test ${{ matrix.backend }} ${{ matrix.shard }}
        run: |
          cat <<EOF > ./subclass.py
          import importlib
          import os
          import subprocess
          import sys

          sys.path.append('qa/pull-tester')
          rpc_tests = importlib.import_module('rpc-tests')

          src_dir = os.environ["SRC_DIR"]
          build_dir = '.'
          exeext = '${{ matrix.file_ext }}'

          class MyTestHandler(rpc_tests.RPCTestHandler):
              def start_test(self, args, stdout, stderr):
                  return subprocess.Popen(
                      args,
                      universal_newlines=True,
                      stdout=stdout,
                      stderr=stderr)

          test_list = ${{ toJSON(matrix.rpc_tests) }}
          all_passed = rpc_tests.run_tests(MyTestHandler, test_list, src_dir, build_dir, exeext, jobs=len(test_list))
          if all_passed == False:
              sys.exit(1)
          EOF
          . ./venv/bin/activate
          ZALLET_BACKEND=${{ matrix.backend }} ZEBRAD=$(pwd)/${{ format('src/zebrad{0}', matrix.file_ext) }} ZAINOD=$(pwd)/${{ format('src/zainod{0}', matrix.file_ext) }} ZALLET=$(pwd)/${{ format('src/zallet{0}', matrix.file_ext) }} SRC_DIR=$(pwd) python3 ./subclass.py

      - uses: ./.github/actions/finish-interop
        if: always()
        with:
          app-token: ${{ steps.start-interop.outputs.app-token }}
          requesting-owner: ${{ steps.repo-ids.outputs.requesting-owner }}
          requesting-repository: ${{ steps.repo-ids.outputs.requesting-repository }}
          job-name: "RPC tests ${{ matrix.platform }} ${{ matrix.backend }} ${{ matrix.shard }}${{ matrix.required_suffix }}"
