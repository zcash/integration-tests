name: Lints

# We only run these lints on trial-merges of PRs to reduce noise.
on: pull_request

jobs:
  commit-script-check:
    name: Scripted diffs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check scripted diffs
        run: ./test/lint/commit-script-check.sh ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  general-lints:
    name: General
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo python3 -m pip install yq

      - name: Shebang
        run: ./test/lint/lint-shebang.sh
        if: always()
        continue-on-error: true # Temporary until we get this passing

      - name: Shell locale
        run: ./test/lint/lint-shell-locale.sh
        if: always()
        continue-on-error: true # Temporary until we get this passing

      - name: Shellcheck
        run: ./test/lint/lint-shell.sh
        if: always()

      - name: Whitespace
        run: ./test/lint/lint-whitespace.sh
        if: always()

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        run: sudo python3 -m pip install pyflakes

      - name: Pyflakes
        run: pyflakes qa .github/scripts
        if: always()

      - name: UTF-8 encoding
        run: ./test/lint/lint-python-utf8-encoding.sh
        if: always()

  ci-scripts:
    name: CI scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # Configured under [tool.ruff] and [tool.mypy] in pyproject.toml.
      - name: Install dependencies
        run: python3 -m pip install ruff==0.17.4 mypy==2.4.1

      - name: Ruff lint
        run: ruff check .github/scripts
        if: always()

      - name: Ruff format
        run: ruff format --check .github/scripts
        if: always()

      - name: Mypy
        run: mypy
        if: always()

      - name: Unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
        if: always()
